  - id: prothom-alo
    name_bn: "প্রথম আলো"
    name_en: "Prothom Alo"
    language: bn
    enabled: true
    logo: "assets/logos/prothom-alo.svg"
    website: "https://www.prothomalo.com"
    section_url: "https://www.prothomalo.com/opinion"
    fetch_method: html
    parser: prothom_alo
    default_category: opinion
    min_articles: 5
    max_articles: 12
    selectors:
      ssr_script: "script#static-page"
      item_link: "a[href*='/opinion/']"
      title: "meta[property='og:title'], h1"
      author: "meta[name='author']"
      published_at: "meta[property='article:published_time']"
      body: "div.story-element-text p, article p"
    notes: "Official /stories.rss is general news; /opinion uses Quintype SSR JSON in script#static-page (verified, allowed by robots.txt)."

  - id: kaler-kantho
